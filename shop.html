<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f1a;color:#e8e0d0;font-family:Georgia,serif;min-height:100vh;padding:20px}
.container{max-width:900px;margin:0 auto}
header{text-align:center;padding:20px 0 30px;border-bottom:2px solid #c9a227;margin-bottom:20px}
h1{color:#c9a227;font-size:1.8rem;letter-spacing:2px;text-shadow:0 0 10px rgba(201,162,39,.5)}
.subtitle{color:#8a8070;font-size:.9rem;margin-top:6px;font-style:italic}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center}
.tab{background:#1a1a2a;border:1px solid #3a3a4a;color:#a09888;padding:8px 18px;cursor:pointer;border-radius:4px;font-family:inherit;font-size:.9rem;transition:all .2s}
.tab:hover{border-color:#c9a227;color:#c9a227}
.tab.active{background:#c9a227;color:#0f0f1a;border-color:#c9a227;font-weight:bold}
.search{width:100%;padding:10px 14px;background:#1a1a2a;border:1px solid #3a3a4a;border-radius:4px;color:#e8e0d0;font-family:inherit;margin-bottom:20px;font-size:.95rem}
.search:focus{outline:none;border-color:#c9a227}
.section-header{color:#c9a227;font-size:1.1rem;letter-spacing:3px;text-transform:uppercase;margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid #3a3a4a;display:flex;align-items:center;gap:10px;font-weight:normal}
.section-header:first-child{margin-top:0}
.section-count{background:#2a2a3a;color:#a09888;font-size:.7rem;padding:2px 8px;border-radius:10px;letter-spacing:0;font-weight:normal}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:#1a1a2a;border:1px solid #2a2a3a;border-radius:6px;padding:14px;display:flex;gap:12px;align-items:flex-start;transition:all .2s}
.card:hover{border-color:#c9a227;transform:translateY(-2px);box-shadow:0 4px 12px rgba(201,162,39,.15)}
.icon{width:40px;height:40px;flex-shrink:0;image-rendering:pixelated;background:#0f0f1a;border-radius:4px;border:1px solid #2a2a3a}
.info{flex:1;min-width:0}
.name{font-weight:bold;color:#e8e0d0;font-size:1rem;margin-bottom:4px}
.desc{font-size:.8rem;color:#8a8070;margin-bottom:6px;line-height:1.3}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;gap:8px;flex-wrap:wrap}
.lv{color:#8a8070}
.price{color:#c9a227;font-weight:bold}
.price::after{content:" \1F4B0"}
.stats{font-size:.75rem;color:#6a9080;margin-top:6px}
.empty{text-align:center;color:#8a8070;padding:40px;font-style:italic}
footer{text-align:center;color:#5a5060;font-size:.8rem;margin-top:40px;padding-top:20px;border-top:1px solid #2a2a3a}
</style>

let currentTab = "armi"; let searchQuery = "";
const CATEGORIES = [
{id:"armi",label:"⚔️ Armi"},
{id:"armature",label:"🛡️ Armature"},
{id:"accessori",label:"💍 Accessori"},
{id:"essenze",label:"✨ Essenze"},
{id:"consumabili",label:"🧪 Consumabili"}
];
function renderTabs(){
  const t=document.getElementById("tabs");
  t.innerHTML=CATEGORIES.map(c=>`<button class="tab ${c.id===currentTab?"active":""}" data-tab="${c.id}">${c.label}</button>`).join("");
  t.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
    currentTab=b.dataset.tab;
    renderTabs(); renderGrid();
  }));
}
function formatStats(it){
  if(!it.params)return "";
  const k=["HP","MP","FRZ","COS","MAG","RES","DEX","LUK"];
  const p=[];
  it.params.forEach((v,i)=>{if(v&&v!==0)p.push((v>0?"+":"")+v+" "+k[i])});
  return p.join(" • ")
}
function cardHtml(it){
  const icon=it.iconData?`<img class="icon" src="${it.iconData}" alt="">`:'<div class="icon"></div>';
  const lv=it.lv?`<span class="lv">Lv ${it.lv}</span>`:(it.id?`<span class="lv">ID: #${it.id}</span>`:"");
  const desc=it.desc?`<div class="desc">${it.desc}</div>`:"";
  const stats=formatStats(it);
  const sh=stats?`<div class="stats">${stats}</div>`:"";
  return `<div class="card">${icon}<div class="info"><div class="name">${it.name}</div>${desc}<div class="meta">${lv}<span class="price">${it.price}</span></div>${sh}</div></div>`;
}
function renderGrid(){
  const c=document.getElementById("content");
  let items=DATA[currentTab]||[];
  if(searchQuery)items=items.filter(it=>it.name.toLowerCase().includes(searchQuery));
  if(items.length===0){c.innerHTML='<div class="empty">Nessun oggetto trovato.</div>';return}
  const subs=(DATA.subcategories&&DATA.subcategories[currentTab])||[];
  if(subs.length===0){
    c.innerHTML=`<div class="grid">${items.map(cardHtml).join("")}</div>`;
    return;
  }
  let html="";
  subs.forEach(sub=>{
    const subItems=items.filter(it=>it.sub===sub);
    if(subItems.length===0)return;
    html+=`<h2 class="section-header">${sub} <span class="section-count">${subItems.length}</span></h2>`;
    html+=`<div class="grid">${subItems.map(cardHtml).join("")}</div>`;
  });
  const noSub=items.filter(it=>!it.sub);
  if(noSub.length>0){
    html+=`<div class="grid">${noSub.map(cardHtml).join("")}</div>`;
  }
  c.innerHTML=html;
}
document.getElementById("search").addEventListener("input",e=>{searchQuery=e.target.value.toLowerCase().trim();renderGrid()});
renderTabs();renderGrid();
</script>
